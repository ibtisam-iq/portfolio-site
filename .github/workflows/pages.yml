# Builds the site and publishes it to GitHub Pages, and builds a preview for every pull
# request. This is the workflow that puts ibtisam-iq.com on the internet.

name: GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/LICENSE'
      - 'docs/**'
      - 'helm/**'
      - 'plans/**'
      - '.github/**'
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths-ignore:
      - '**/*.md'
      - '**/LICENSE'
      - 'docs/**'
      - 'helm/**'
      - 'plans/**'
      - '.github/**'
  workflow_dispatch:

  # The site reads four sources it does not own, two of which change with no commit at all,
  # so without a schedule the published numbers only refresh when this repository is pushed.
  # See REFERENCE.md.

  # The offset minute is deliberate: GitHub delays runs queued on the hour. It also disables
  # schedules in a repository with no push activity for 60 days, which is the first thing to
  # check if the numbers freeze.
  schedule:
    - cron: '17 3 * * *'

# One production deploy at a time, plus one preview per pull request. Every production
# trigger shares a group on purpose: with the event name in the key a scheduled run and a
# push would race each other for the single Pages deployment slot.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:

  # ────────────────────────────────────────────────────────────────
  # JOB 1: Build + QA
  # ────────────────────────────────────────────────────────────────
  build-and-quality:
    name: Build Site
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The site build renders the CV, and cv/cv.html asks for Arial, which no Linux
      # runner has. Liberation Sans is metrically identical, so pagination matches a
      # local macOS build instead of moving under a wider fallback.
      - name: Install metric-compatible fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation
          fc-match Arial

      - name: Lint
        run: npm run lint

      # The writing rules for every comment and document here, enforced the same way the
      # colour ones are. See scripts/check-prose.mjs.
      - name: Check prose
        run: npm run check:prose

      # `tsc -b` runs inside `npm run build`, so there is no separate typecheck step.
      # GITHUB_TOKEN lifts scripts/generate-stats.js off the anonymous API limit.

      # CV_PHONE and CV_SECRET turn the unlisted CV on. Without them the build still
      # succeeds and emits the public one, which is what every fork and pull request gets.
      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CV_PHONE: ${{ secrets.CV_PHONE }}
          CV_SECRET: ${{ secrets.CV_SECRET }}

      # Every route must carry its own og:url, or a crawler that does not run JavaScript
      # resolves every page back to the root.

      # The routes come from the router in src/App.tsx. A list written here is a second
      # definition of what pages exist, and it drifts: it named `skills` long after the
      # route became `/tools`.
      - name: Verify per-route metadata
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const app = readFileSync("src/App.tsx", "utf8")
            const routes = [...app.matchAll(/path="\/([a-z-]+)"/g)].map((m) => m[1])
            if (routes.length === 0) {
              console.log("::error::no routes found in src/App.tsx")
              process.exit(1)
            }
            let failed = false
            for (const route of routes) {
              const file = `dist/${route}/index.html`
              let html
              try {
                html = readFileSync(file, "utf8")
              } catch {
                console.log(`::error::${file} was not generated by scripts/prerender-meta.js`)
                failed = true
                continue
              }
              if (!html.includes(`og:url" content="https://ibtisam-iq.com/${route}"`)) {
                console.log(`::error file=${file}::og:url does not point at /${route}`)
                failed = true
              }
            }
            console.log(`checked ${routes.length} routes: ${routes.join(", ")}`)
            process.exit(failed ? 1 : 0)
          '

      # The colour system publishes its ratios in tailwind.config.js. This is what checks
      # them, in a real browser, on the build that is about to be deployed.
      - name: Check contrast
        run: npm run check:contrast

      # CNAME: tells GitHub Pages which custom domain to serve
      - name: Write CNAME
        run: echo "ibtisam-iq.com" > dist/CNAME

      # 404.html is emitted by scripts/prerender-meta.js during the build, with
      # its own title and noindex. Copying index.html here would overwrite that.

      - name: Upload Pages artifact
        if: ${{ env.ACT != 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  # JOB 2: PR preview, on pull_request only. Served at /pr-preview/pr-<number>/, removed
  # when the pull request closes, and posted back as a comment on it.
  pr-preview:
    name: Deploy PR Preview
    # Runs on all PR events; rossjrw/pr-preview-action handles deploy vs cleanup
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: write       # gh-pages branch push
      pull-requests: write  # post preview URL comment via marocchino/sticky-pull-request-comment

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: github.event.action != 'closed'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci

      # Scopes every asset path and the router's basename to the sub-path the preview is
      # served from. This must equal `umbrella_dir` below plus `pr-<number>`: when the two
      # disagreed, every asset in a preview resolved to a path with nothing at it.
      - name: Build
        if: github.event.action != 'closed'
        run: npm run build
        env:
          VITE_BASE_PATH: /pr-preview/pr-${{ github.event.pull_request.number }}/
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No CNAME here: it would redirect away from /pr-preview/pr-N.
      # 404.html comes from scripts/prerender-meta.js, same as the deploy job.

      # token: required, because rossjrw calls marocchino/sticky-pull-request-comment
      # internally; without explicit token it falls back to a read-only default
      - name: Deploy PR preview
        if: ${{ env.ACT != 'true' }}
        uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source_dir: ./dist
          umbrella_dir: pr-preview
          action: auto
          token: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────────────────────────────────────────────────
  # JOB 3: Production Deploy (runs ONLY on push to main)
  # ────────────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to GitHub Pages
    needs: build-and-quality
    # Scheduled and manual runs must deploy too. Gating on `push` alone meant a cron
    # run would build the fresh numbers and then throw them away without publishing.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        if: ${{ env.ACT != 'true' }}
        id: deployment
        uses: actions/deploy-pages@v5
