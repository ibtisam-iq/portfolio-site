# Builds the site and publishes it. This is the workflow that puts ibtisam-iq.com on the
# internet: Cloudflare Pages serves the domain, and the same build is also uploaded to
# GitHub Pages, which stays current as a rollback one DNS record away.

name: GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/LICENSE'
      - 'docs/**'
      - 'helm/**'
      - 'plans/**'
      - '.github/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/LICENSE'
      - 'docs/**'
      - 'helm/**'
      - 'plans/**'
      - '.github/**'
  workflow_dispatch:

  # The site reads four sources it does not own, two of which change with no commit at all,
  # so without a schedule the published numbers only refresh when this workflow is run by
  # hand. This is the only automatic deploy. See REFERENCE.md.

  # The offset minute is deliberate: GitHub delays runs queued on the hour. It also disables
  # schedules in a repository with no push activity for 60 days, which is the first thing to
  # check if the numbers freeze.
  schedule:
    - cron: '17 3 * * *'

# One deploy at a time, plus one check per pull request. Every publishing trigger shares a
# group on purpose: with the event name in the key, a scheduled run and a push would race
# each other for the same deployment.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:

  # ────────────────────────────────────────────────────────────────
  # JOB 1: Build + QA
  # ────────────────────────────────────────────────────────────────
  build-and-quality:
    name: Build Site
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The site build renders the CV, and cv/cv.html asks for Arial, which no Linux
      # runner has. Liberation Sans is metrically identical, so pagination matches a
      # local macOS build instead of moving under a wider fallback.
      - name: Install metric-compatible fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation
          fc-match Arial

      - name: Lint
        run: npm run lint

      # The writing rules for every comment and document here, enforced the same way the
      # colour ones are. See scripts/check-prose.mjs.
      - name: Check prose
        run: npm run check:prose

      # `tsc -b` runs inside `npm run build`, so there is no separate typecheck step.
      # GITHUB_TOKEN lifts scripts/generate-stats.js off the anonymous API limit.

      # CV_PHONE and CV_SECRET turn the unlisted CV on. Without them the build still
      # succeeds and emits the public one, which is what every fork and pull request gets.
      - name: Build
        run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CV_PHONE: ${{ secrets.CV_PHONE }}
          CV_SECRET: ${{ secrets.CV_SECRET }}

      # Every route must carry its own og:url, or a crawler that does not run JavaScript
      # resolves every page back to the root.

      # The routes come from the router in src/App.tsx. A list written here is a second
      # definition of what pages exist, and it drifts: it named `skills` long after the
      # route became `/tools`.
      - name: Verify per-route metadata
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const app = readFileSync("src/App.tsx", "utf8")
            const routes = [...app.matchAll(/path="\/([a-z-]+)"/g)].map((m) => m[1])
            if (routes.length === 0) {
              console.log("::error::no routes found in src/App.tsx")
              process.exit(1)
            }
            let failed = false
            for (const route of routes) {
              const file = `dist/${route}/index.html`
              let html
              try {
                html = readFileSync(file, "utf8")
              } catch {
                console.log(`::error::${file} was not generated by scripts/prerender-meta.js`)
                failed = true
                continue
              }
              if (!html.includes(`og:url" content="https://ibtisam-iq.com/${route}/"`)) {
                console.log(`::error file=${file}::og:url does not point at /${route}`)
                failed = true
              }
            }
            console.log(`checked ${routes.length} routes: ${routes.join(", ")}`)
            process.exit(failed ? 1 : 0)
          '

      # The colour system publishes its ratios in REFERENCE.md, and the palette lives in
      # src/index.css. This is what checks them, in a real browser, on the build that is
      # about to be deployed.
      - name: Check contrast
        run: npm run check:contrast

      # Pre-rendering is the one thing here that breaks without looking broken: React
      # quietly rebuilds a page whose markup it did not expect, and the site still works.
      # See scripts/check-hydration.mjs.
      - name: Check hydration
        run: npm run check:hydration

      # CNAME: tells GitHub Pages which custom domain to serve
      - name: Write CNAME
        run: echo "ibtisam-iq.com" > dist/CNAME

      # 404.html is emitted by scripts/prerender-meta.js during the build, with
      # its own title and noindex. Copying index.html here would overwrite that.

      # Skipped on a pull request: the gates above are the point there, and a fork or a
      # Dependabot branch cannot read the secrets a deploy needs anyway.
      - name: Upload Pages artifact
        if: ${{ env.ACT != 'true' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      # The host that serves ibtisam-iq.com. Cloudflare builds nothing: the project is
      # Direct Upload and this hands it the directory built above, so the CV render keeps
      # the runner that satisfies it. See REFERENCE.md.

      # The two secrets are read here and nowhere else. Neither reaches the site, the
      # container or the browser.
      - name: Deploy to Cloudflare Pages
        if: ${{ env.ACT != 'true' && github.event_name != 'pull_request' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=portfolio-site --branch=main

      # The pull-request preview job that used to live here is gone: it published to a
      # gh-pages branch this deployment no longer uses. Cloudflare Pages offers branch
      # previews natively if one is wanted again.

  # ────────────────────────────────────────────────────────────────
  # JOB 2: GitHub Pages, kept as the rollback
  # ────────────────────────────────────────────────────────────────

  # Cloudflare Pages serves the domain. This publishes the same build to GitHub Pages as
  # well, so the fallback is a current site rather than whatever was last deployed before
  # the move: going back is one DNS record, pointing the apex at ibtisam-iq.github.io again.
  deploy-production:
    name: Deploy to GitHub Pages
    needs: build-and-quality
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'schedule' ||
       github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        if: ${{ env.ACT != 'true' }}
        id: deployment
        uses: actions/deploy-pages@v5
