name: Build CV PDF

on:
  push:
    branches: [main]
    paths:
      - 'cv/**'
  workflow_dispatch:

concurrency:
  group: cv-build
  cancel-in-progress: true

jobs:
  build-cv:
    name: Build CV PDF
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # cv.html asks for Arial, which no Linux runner has. Liberation Sans is
      # metrically identical, so pinning it here keeps CI pagination the same as
      # a local macOS build. Without it the runner picks an arbitrary wider
      # fallback and the page breaks move.
      - name: Install metric-compatible fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation
          fc-match Arial

      - name: Build PDF
        run: node cv/build-pdf.mjs

      - name: Commit updated PDF
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/cv.pdf
          if git diff --cached --quiet; then
            echo "No changes to CV PDF"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: rebuild CV PDF"
            git pull --rebase
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

