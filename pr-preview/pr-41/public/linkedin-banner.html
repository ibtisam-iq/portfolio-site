<title>LinkedIn Banner</title>
<style>
  :root {
    --ground: #0b1121;
    --surface: #0f1a2e;
    --text-primary: #e1e7ef;
    --text-muted: #5a6a82;
    --accent: #2d7ff9;
    --accent-sky: #0ea5e9;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #050810;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    padding: 24px;
  }

  .banner-shell {
    width: 100%;
    max-width: 1584px;
    position: relative;
  }

  .banner {
    width: 1584px;
    height: 396px;
    position: relative;
    overflow: hidden;
    background: var(--ground);
    transform-origin: top left;
  }

  /* --- background layers --- */
  .bg-wash {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 70% 22%, rgba(45,127,249,0.045) 0%, transparent 52%),
      radial-gradient(ellipse at 22% 68%, rgba(14,165,233,0.02) 0%, transparent 42%),
      linear-gradient(155deg, #0b1121 0%, #0f1a2e 42%, #0d1628 72%, #0b1121 100%);
  }

  .dot-field {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle, rgba(148,163,184,0.032) 1px, transparent 1px);
    background-size: 36px 36px;
    background-position: 18px 18px;
  }

  /* --- constellation SVG --- */
  .constellation {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* --- bottom accent --- */
  .edge-line {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg,
      transparent 6%,
      rgba(45,127,249,0.12) 24%,
      rgba(45,127,249,0.42) 43%,
      rgba(14,165,233,0.42) 57%,
      rgba(14,165,233,0.12) 76%,
      transparent 94%
    );
  }

  /* --- content --- */
  .content {
    position: absolute;
    z-index: 10;
    left: 440px;
    top: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .headline {
    display: flex;
    align-items: baseline;
    gap: 14px;
  }

  .hl-num {
    font-size: 72px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: -3px;
    line-height: 1;
  }

  .hl-text {
    font-size: 48px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -1.5px;
    line-height: 1;
  }

  .tagline {
    font-size: 17px;
    color: var(--text-muted);
    margin-top: 20px;
    font-weight: 400;
    letter-spacing: 0.25px;
  }

  .site {
    font-size: 15px;
    color: var(--accent);
    margin-top: 14px;
    font-weight: 500;
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', Consolas, 'Liberation Mono', monospace;
    letter-spacing: 0.3px;
    opacity: 0.78;
  }

  /* --- instructions (outside banner) --- */
  .how-to {
    color: #4a5a72;
    font-size: 13px;
    margin-top: 22px;
    text-align: center;
    line-height: 1.7;
    max-width: 560px;
  }
  .how-to kbd {
    display: inline-block;
    background: #131d33;
    border: 1px solid #243352;
    border-radius: 4px;
    padding: 1px 6px;
    font-size: 11px;
    font-family: 'SF Mono', Consolas, monospace;
    color: #8a9ab2;
    vertical-align: 1px;
  }
</style>

    </svg>

    <div class="content">
      <div class="headline">
        <span class="hl-num">8</span>
        <span class="hl-text">Infrastructure Projects</span>
      </div>
      <div class="tagline">Every project documented: source code, runbooks, terminal sessions</div>
      <div class="site">projects.ibtisam-iq.com</div>
    </div>

    <div class="edge-line"></div>
  </div>
</div>

<p class="how-to">
  1584 &times; 396 &mdash; To save on Mac: <kbd>&#8984;</kbd> <kbd>&#8679;</kbd> <kbd>4</kbd> and drag over the banner.<br>
  For pixel-perfect export: right-click the banner &rarr; Inspect &rarr; right-click the element &rarr; <em>Capture node screenshot</em>.
</p>

<script>
  function fit() {
    var shell = document.querySelector('.banner-shell');
    var banner = document.getElementById('banner');
    var scale = Math.min(1, shell.clientWidth / 1584);
    banner.style.transform = 'scale(' + scale + ')';
    shell.style.height = Math.round(396 * scale) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();
</script>
