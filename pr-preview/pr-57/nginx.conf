# Serves the built site inside the container image: non-privileged port, hardened headers,
# an SPA fallback and asset caching. The container deployment only. GitHub Pages serves the
# same dist/ with its own headers, so a rule added here changes one deployment of two.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # -- Security headers -----------------------------------------------------

    # Every source here is one the built page actually uses, api.github.com being the hero's
    # live "newest push" read (src/hooks/useLatestPush.ts). Never widen script-src to
    # 'unsafe-inline' or add a script hash: a hash breaks silently on a whitespace edit.
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.github.com https://www.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
        always;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    # X-XSS-Protection omitted: deprecated in Chrome 78+, harmful on IE11, and CSP covers it
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # -- Compression ----------------------------------------------------------
    # Runtime gzip; upgrade path: vite-plugin-compression + gzip_static on
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # -- Static assets --------------------------------------------------------
    # Vite content-hashes every filename, so a one-year immutable cache is safe.

    # `.map` is here because vite.config.ts sets `sourcemap: true`: the build publishes a
    # source map, and every comment in this repository is readable at that URL.
    location ~* \.(js|css|woff2|woff|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp|avif|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # add_header not inherited inside location blocks
        add_header X-Content-Type-Options "nosniff" always;
    }

    # -- SPA fallback ---------------------------------------------------------
    # react-router-dom owns all routing; unknown paths must resolve to index.html
    location / {
        try_files $uri $uri/ /index.html;

        # index.html must not be cached: stale HTML references old hashed asset URLs
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
