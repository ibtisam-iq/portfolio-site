<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- The theme, applied before first paint so a light-mode visitor sees no dark flash.
         Blocking on purpose: deferring it is the flash. -->
    <script src="%BASE_URL%theme.js"></script>

    <!-- Google tag. The config lives in a file rather than inline, so the container's
         content security policy needs no script hash. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XP2J3MPRYJ"></script>
    <script src="%BASE_URL%analytics.js"></script>

    <!-- Page Title -->
    <title>Muhammad Ibtisam Iqbal | DevOps & Cloud Engineer</title>

    <!-- Meta Description -->
    <meta
      name="description"
      content="Muhammad Ibtisam Iqbal, CKA and CKAD certified DevOps & Cloud Engineer. Kubernetes, EKS, Terraform, GitOps with ArgoCD, DevSecOps on Jenkins and GitHub Actions."
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://ibtisam-iq.com/" />

    <!-- Favicons -->
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Ibtisam" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Muhammad Ibtisam Iqbal | DevOps & Cloud Engineer"
    />
    <meta
      property="og:description"
      content="CKA and CKAD certified DevOps & Cloud Engineer. Kubernetes on kubeadm and EKS, Terraform, GitOps with ArgoCD, DevSecOps pipelines on Jenkins and GitHub Actions. Islamabad, Pakistan."
    />
    <meta property="og:url" content="https://ibtisam-iq.com/" />
    <meta property="og:image" content="https://ibtisam-iq.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://ibtisam-iq.com/og-image.png" />
    <meta
      name="twitter:title"
      content="Muhammad Ibtisam Iqbal | DevOps & Cloud Engineer"
    />
    <meta
      name="twitter:description"
      content="CKA and CKAD certified DevOps & Cloud Engineer. Kubernetes on kubeadm and EKS, Terraform, GitOps with ArgoCD, DevSecOps pipelines on Jenkins and GitHub Actions. Islamabad, Pakistan."
    />
    <!-- The anchor scripts/prerender-meta.js matches on, kept minimal: it is replaced at
         build time with the full graph derived from scripts/profile.js, so anything spelled
         out here is a second copy that drifts. Never what production serves. -->
    <script type="application/ld+json">
      { "@context": "https://schema.org", "@type": "Person", "name": "Muhammad Ibtisam Iqbal" }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
