# The security headers, in a file of their own, included by every location in nginx.conf.

# nginx does not inherit add_header into a location that declares one of its own, and both
# locations declare caching. Before this file existed the HTML pages, which are the only
# place a content policy does anything at all, were served carrying none of it.

# scripts/prerender-meta.js parses this file to write dist/_headers, so the static host and
# the container take one policy from one source. See REFERENCE.md.

# Every source here is one the built page actually uses, api.github.com being the hero's
# live "newest push" read (src/hooks/useLatestPush.ts). Never widen script-src to
# 'unsafe-inline' or add a script hash: a hash breaks silently on a whitespace edit.

# font-src is 'self' alone, and style-src names no host, because the two families are
# served from this origin. Both narrowed when src/index.css took over the @font-face
# rules; re-adding a Google host here means the fonts have quietly moved back.
add_header Content-Security-Policy
    "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://api.github.com https://www.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"
    always;

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
# X-XSS-Protection omitted: deprecated in Chrome 78+, harmful on IE11, and CSP covers it
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Isolates this window from anything that opens it, which is the other half of the
# clickjacking defence X-Frame-Options starts.
add_header Cross-Origin-Opener-Policy "same-origin" always;
