# Serves the built site inside the container image: non-privileged port, hardened headers,
# real 404s and asset caching. The container deployment only. Cloudflare Pages serves the
# same dist/ using dist/_headers, which is generated from nginx-security-headers.conf, so
# the policy is shared and the rest of this file is not.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 1m;

    # Redirects go out as a path, not a URL. nginx builds an absolute one from its own
    # listen port by default, so `/tools` answered with a Location on port 8080: correct
    # inside the container and wrong through anything that publishes it on another port.
    absolute_redirect off;

    # -- Security headers -----------------------------------------------------

    # Included here and again in every location below. nginx drops the whole inherited set
    # the moment a location adds a header of its own, so leaving this at server level alone
    # served the pages with no policy while this file read as though they had one.
    include /etc/nginx/security-headers.conf;

    # -- Compression ----------------------------------------------------------
    # Runtime gzip; upgrade path: vite-plugin-compression + gzip_static on
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # -- Fingerprinted assets -------------------------------------------------

    # Scoped to the directory, not to a list of extensions. Matching on extension gave a
    # year of immutable caching to public/theme.js, public/analytics.js and the favicons,
    # none of which carry a hash, so a change to any of them reached nobody for a year.

    # `^~`, or the regex block below wins this path anyway: nginx tries regex locations
    # before a plain prefix match, and only that marker stops it. Without it these files
    # were served with the four-hour rule and the whole point of hashing them was lost.
    location ^~ /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # -- Everything else ------------------------------------------------------

    # Four hours for the unhashed static files, which is what Cloudflare Pages serves them
    # with. They change rarely and none of them is named by a hashed URL.
    location ~* \.(js|css|woff2|woff|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp|avif|pdf|txt|xml|map)$ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=14400, must-revalidate" always;
    }

    # Every route is a directory with its own index.html, so a path resolving to nothing
    # is genuinely not a page here.

    # This fell back to index.html, answering 200, and once the build started rendering
    # that served the landing page's own content at a dead address.
    location / {
        try_files $uri $uri/ =404;

        include /etc/nginx/security-headers.conf;
        # Revalidate every time rather than refuse to store: the HTML names hashed asset
        # URLs, so a stale copy is broken, but a 304 on an unchanged page is free.
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # The build writes this one with its own title and a noindex. Reachable directly as
    # well, because the shell names itself as its own canonical.
    error_page 404 /404.html;
    location = /404.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
}
